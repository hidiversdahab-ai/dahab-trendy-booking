<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Booking Request · طلب حجز</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--line:rgba(201,168,76,.28);--gold:#c9a84c;--text:#f2efe6;--muted:#9a97a8;--ok:#4cda7a;--bad:#e0685e}
@media (prefers-color-scheme: light){:root{--bg:#f6f3ea;--card:#fff;--line:rgba(150,115,30,.3);--gold:#8a6a14;--text:#1d1b16;--muted:#6c6a63}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
body{padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0;color:var(--gold)}
.sub{color:var(--muted);font-size:13px;margin:2px 0 12px}
.lang select{background:transparent;border:1px solid var(--line);color:var(--gold);border-radius:99px;padding:6px 10px;font-size:13px;max-width:130px}.lang select option{color:#000}
.lang button{background:transparent;border:1px solid var(--line);color:var(--gold);border-radius:99px;padding:5px 12px;font-weight:700;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--gold);font-weight:700;margin:12px 0 5px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
select option{color:#111}
textarea{min-height:72px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.main{width:100%;background:var(--gold);color:#1a1a2e;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:16px}
button.main:disabled{opacity:.55}
button.ghost{background:transparent;border:1px dashed var(--line);color:var(--gold);border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;margin-top:8px}
button.x{background:transparent;border:0;color:var(--bad);font-size:18px;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1em}
.ok{color:var(--ok)}
.pol{font-size:12.5px;color:var(--muted);line-height:1.8}
.pol .pl{unicode-bidi:plaintext;text-align:start;white-space:pre-line;margin:0 0 2px}
.pol .pl.gap{margin-top:10px}
.pol .pl.cf{color:var(--text,inherit);font-weight:700;margin-top:8px}
.big{font-size:44px;text-align:center}
.center{text-align:center}
.gx{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px;align-items:center}
.hp{position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
a.wa.tg{background:#229ED9}a.wa.vb{background:#7360f2}
a.wa{display:block;text-align:center;background:#25D366;color:#fff;text-decoration:none;border-radius:12px;padding:12px;font-weight:800;margin-top:10px}
.qb{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px}
.ql{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:6px}
.qt{display:flex;justify-content:space-between;gap:10px;font-size:17px;font-weight:800;color:var(--gold);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="hname">…</h1><div class="lang"><select id="langSel" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option><option value="de">Deutsch</option><option value="ru">Русский</option><option value="fr">Français</option><option value="it">Italiano</option><option value="tr">Türkçe</option></select></div></div>
  <div class="sub" id="sub"></div>
  <div id="facs" class="card" hidden><div id="facs-t" style="font-size:12px;color:var(--gold);font-weight:700;margin-bottom:8px"></div><div id="facs-l" style="display:flex;flex-wrap:wrap;gap:6px"></div></div>

  <div id="view-error" class="card" hidden><div class="big">⚠️</div><div class="center" id="errtxt"></div></div>

  <form id="view-form" class="card" hidden novalidate autocomplete="on">
    <label id="l-name"></label><input id="f-name" maxlength="120" autocomplete="name">
    <label id="l-phone"></label><input id="f-phone" type="tel" inputmode="tel" maxlength="40" autocomplete="tel" placeholder="+20 …">
    <label id="l-dob"></label><input id="f-dob" type="date">
    <div class="row">
      <div><label id="l-ci"></label><input id="f-ci" type="date"></div>
      <div><label id="l-co"></label><input id="f-co" type="date"></div>
    </div>
    <label id="l-type"></label><select id="f-type"></select>
    <div id="w-view" hidden><label id="l-view"></label><select id="f-view"></select></div>
    <div class="hint" id="avail"></div>
    <div class="qb" id="quote" hidden><label id="l-cur" style="margin-top:0"></label><select id="f-cur"></select><div id="q-lines"></div><div class="hint" id="q-note"></div></div>
    <div class="row">
      <div><label id="l-adults"></label><input id="f-adults" type="number" inputmode="numeric" min="1" max="20" value="1"></div>
      <div><label id="l-children"></label><input id="f-children" type="number" inputmode="numeric" min="0" max="20" value="0"></div>
    </div>
    <div id="extra"></div>
    <button type="button" class="ghost" id="addG"></button>
    <label id="l-notes"></label><textarea id="f-notes" maxlength="1000"></textarea>
    <input class="hp" id="f-web" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:12px;line-height:1.5;"><input type="checkbox" id="f-consent" style="width:auto;margin-top:3px"><span>أوافق على معالجة بياناتي لتنفيذ الحجز · I agree to my data being processed for this booking. <a href="privacy.html" target="_blank" rel="noopener">الخصوصية · Privacy</a></span></label>
    <div class="err" id="ferr"></div>
    <button type="submit" class="main" id="send"></button>
  </form>

  <div id="view-policy" class="card" hidden><label id="l-policy" style="margin-top:0"></label><div class="pol" id="pol"></div></div>

  <div id="view-done" class="card center" hidden>
    <div class="big">✅</div>
    <h2 id="d-title" style="color:var(--gold);margin:6px 0"></h2>
    <div id="d-text" class="pol" style="text-align:center"></div>
    <a id="d-wa" class="wa" hidden target="_blank" rel="noopener"></a>
    <a id="d-tg" class="wa tg" hidden target="_blank" rel="noopener"></a>
    <a id="d-vb" class="wa vb" hidden rel="noopener"></a>
  </div>

  <div id="view-cancel" class="card center" hidden>
    <div class="big">🗓️</div>
    <h2 id="c-title" style="color:var(--gold);margin:6px 0"></h2>
    <div id="c-info" class="pol" style="text-align:center"></div>
    <button class="main" id="c-btn" style="background:var(--bad);color:#fff"></button>
    <div class="err" id="c-err"></div>
  </div>
</div>

var stayRules=null;

function minFor(type){ var r=stayRules; if(!r) return 1; var n=(r.byType&&r.byType[type])||r.min||1; return Math.max(1,parseInt(n,10)||1); }
function stayCheck(type,ci,co){
  var r=stayRules; if(!r||!ci||!co||co<=ci) return '';
  var m=minFor(type); if(nightsBetween(ci,co)<m) return t('eMin').replace('{n}',m);
  var bl=r.blocked||[]; for(var i=0;i<bl.length;i++){ var b=bl[i]; if(b&&b.from&&b.to&&ci<=b.to&&co>b.from) return t('eBlocked'); }
  return '';
}

  el.textContent=m>1?t('minHint').replace('{n}',m):'';
}
function renderTypes(){

  var by=freeRoomsByType(rooms,books,ok?ci:'9999-01-01',ok?co:'9999-01-02');
  if(ok&&rpcFree&&rpcKey===ci+'|'+co){ Object.keys(by).forEach(function(k){ if(rpcFree[k]!=null) by[k].free=Math.min(by[k].free,rpcFree[k]); }); }
  sel.innerHTML='';
  var names=Object.keys(by).sort();
  var ph=document.createElement('option'); ph.value=''; ph.textContent='— '+(ok?t('type').replace(' *',''):t('pick'))+' —'; sel.appendChild(ph);
  names.forEach(function(n){

    if(ok&&free<=0) o.disabled=true;

  });
  if(prev && names.indexOf(prev)>-1) sel.value=prev;

function curCode(c){ return c==='loc'?((CFG&&CFG.lc)||'EGP'):String(c).toUpperCase(); }
function money(n,c){ var v=Math.round((+n||0)*100)/100, f; try{ f=new Intl.NumberFormat(L==='ar'?'ar-EG-u-nu-latn':L,{maximumFractionDigits:v%1?2:0}).format(v); }catch(e){ f=String(v); } return f+' '+curCode(c||CUR); }
function curOptions(){ var out=[]; ['loc','usd','eur'].forEach(function(c){ var any=Object.keys(rates.type).some(function(k){ return (+rates.type[k][c]||0)>0; }); if(any) out.push(c); }); return out; }
function priceTag(type){ var r=rates.type[type]; if(!ENGINE||!r) return ''; var p=+r[CUR]||0; return p>0?' · '+money(p)+'/'+t('night'):''; }
function quoteNow(){
  var ci=$('f-ci').value, co=$('f-co').value, type=$('f-type').value, view=$('f-view')?$('f-view').value:'';
  if(!ENGINE||!type||!ci||!co||co<=ci) return null;
  var n=nightsBetween(ci,co), r=rates.type[type]; if(!r||!(n>0)) return null;
  var per=+r[CUR]||0; if(per<=0) return null;
  var sv=(view&&rates.view[view])?(+rates.view[view][CUR]||0):0;
  return {cur:CUR,code:curCode(CUR),per:per,sv:sv,n:n,total:(per+sv)*n};
}
function renderQuote(){
  var box=$('quote'); if(!box) return;
  var opts=curOptions();
  if(!ENGINE||!opts.length){ box.hidden=true; return; }
  if(opts.indexOf(CUR)<0) CUR=opts[0];

    sel.innerHTML=''; opts.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=curCode(c); sel.appendChild(o); });
    sel.setAttribute('data-k',opts.join(',')+'|'+L);
  }

  if(q){
    line(money(q.per)+' × '+q.n+' '+(q.n===1?t('night'):t('nights')), money(q.per*q.n));
    if(q.sv>0) line(t('viewAdd')+' ('+money(q.sv)+' × '+q.n+')', money(q.sv*q.n));
    line(t('total'), money(q.total), 'qt');
    $('q-note').textContent=t('taxNote');

function fetchAvail(){

  var ci=$('f-ci').value, co=$('f-co').value; if(!ci||!co||co<=ci){ rpcFree=null; return; }
  var key=ci+'|'+co;
  api('/rest/v1/rpc/availability',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_ci:ci,p_co:co})})
   .then(function(r){ if(!r.ok) throw 0; return r.json(); })
   .then(function(rows){ if($('f-ci').value+'|'+$('f-co').value!==key) return; var m={}; (rows||[]).forEach(function(x){ m[x.room_type]=x.free; }); rpcFree=m; rpcKey=key; renderTypes(); })
   .catch(function(){});
}
function holdFirst(type,ci,co){
  if(!ENGINE) return Promise.resolve(null);
  return api('/rest/v1/rpc/hold_room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_type:type,p_ci:ci,p_co:co})})
   .then(function(r){

   })
   .catch(function(){ return null; });
}

$('view-form').addEventListener('submit',function(ev){
  ev.preventDefault();
  var err=function(m){ $('ferr').textContent=m||''; return false; };
  err('');
  if($('f-web').value) return;                                   // honeypot
  if(!$('f-consent').checked) return err('من فضلك وافق على سياسة الخصوصية · Please accept the privacy policy');
  var name=$('f-name').value.trim(), phone=$('f-phone').value.trim(), ci=$('f-ci').value, co=$('f-co').value, type=$('f-type').value;
  var adults=parseInt($('f-adults').value,10)||1, children=parseInt($('f-children').value,10)||0;
  if(!name) return err(t('eName'));
  if(phone.replace(/\D/g,'').length<7) return err(t('ePhone'));
  if(!ci||!co) return err(t('eDate'));
  if(ci<iso(new Date())) return err(t('ePast'));
  if(co<=ci) return err(t('eOrder'));
  if(!type) return err(t('eType'));
  var by=freeRoomsByType(rooms,books,ci,co);
  if(!by[type]||by[type].free<=0) return err(t('eFull'));
  if(by[type].cap && adults+children>by[type].cap) return err(t('eCap'));
  var sc=stayCheck(type,ci,co); if(sc) return err(sc);
  var view=$('f-view')?$('f-view').value:'';
  if(view){ var bv=freeRoomsByView(rooms,books,ci,co,type); if(!bv[view]||bv[view].free<=0) return err(t('eFull')); }
  var noteTxt=$('f-notes').value.trim();
  if(view&&VN[view]) noteTxt='الإطلالة المطلوبة / Requested view: '+VN[view].ar+' / '+VN[view].en+(noteTxt?'\n'+noteTxt:'');
  try{ var last=+localStorage.getItem('hms_form_last')||0; if(Date.now()-last<60000) return err(t('eWait')); }catch(e){}
  var gn=[],gp=[];
  document.querySelectorAll('#extra .gx').forEach(function(r){ var a=r.querySelector('[data-gn]').value.trim(), b=r.querySelector('[data-gp]').value.trim(); if(a){ gn.push(a); gp.push(b); } });
  var dob=$('f-dob').value||null;
  var body={name:name,phone:phone,dob:dob,ci:ci,co:co,room_type:type,adults:Math.max(1,Math.min(20,adults)),children:Math.max(0,Math.min(20,children)),notes:noteTxt||null,
            guest_names:gn.length?gn:null,guest_dobs:gn.length?gn.map(function(){return '';}):null,guest_phones:gn.length?gp:null};
  var btn=$('send'); btn.disabled=true; btn.textContent=t('sending');
  var qn=quoteNow(); if(ENGINE&&qn){ body.quoted_total=Math.round(qn.total*100)/100; body.quoted_currency=qn.code; }
  holdFirst(type,ci,co).then(function(h){
      if(h&&h.sold) throw 'SOLD';
      if(h&&h.id) body.hold_id=h.id;
      return api('/rest/v1/booking_requests',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});
   })
   .then(function(r){ if(!r.ok){ if(body.hold_id) releaseHold(body.hold_id); throw new Error('HTTP '+r.status); }
      try{ localStorage.setItem('hms_form_last',String(Date.now())); }catch(e){}
      if(CFG.w){ var a=$('d-wa'); a.hidden=false; a.textContent='💬 '+t('wa'); a.href='https://wa.me/'+CFG.w+'?text='+encodeURIComponent((L==='ar'?'أهلاً، أنا ':'Hello, I am ')+name+(L==='ar'?' وبعتّ طلب حجز من '+ci+' إلى '+co:' and I sent a booking request for '+ci+' to '+co)); }
      if(CFG.cx){ if(CFG.cx.t){ var tg=$('d-tg'); tg.hidden=false; tg.textContent='\u2708\uFE0F Telegram'; tg.href='https://t.me/'+(CFG.cx.t.charAt(0)==='@'?CFG.cx.t.slice(1):CFG.cx.t); } if(CFG.cx.v){ var vb=$('d-vb'); vb.hidden=false; vb.textContent='\U0001F4DE Viber'; vb.href='viber://chat?number=%2B'+CFG.cx.v; } }
      show('view-done'); window.scrollTo(0,0); })
   .catch(function(e){ btn.disabled=false; btn.textContent=t('send'); err(e==='SOLD'?t('eFull'):t('eSend')); if(e==='SOLD'){ rpcFree=null; fetchAvail(); } });
});

/* ───────── cancel mode ───────── */
function cancelMode(){
  show('view-cancel'); $('c-btn').hidden=true; $('c-info').textContent='…';
  var id=String(CANCEL||'');
  if(!/^[0-9a-f-]{32,40}$/i.test(id)){ $('c-info').textContent=t('cGone'); return; }
  api('/rest/v1/rpc/get_request_for_cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_id:id})})
   .then(function(r){ if(!r.ok) throw 0; return r.json(); })
   .then(function(rows){
      var r=rows&&rows[0];
      if(!r||r.status==='cancelled_by_guest'||r.status==='rejected'){ $('c-info').textContent=t('cGone'); return; }
      $('c-info').textContent=r.name+'\n'+t('cNights')+' '+r.ci+' '+t('cTo')+' '+r.co;
      $('c-btn').hidden=false;
      $('c-btn').onclick=function(){
        $('c-btn').disabled=true; $('c-err').textContent='';
        api('/rest/v1/rpc/cancel_request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_id:id})})
         .then(function(r){ if(!r.ok) throw 0; return r.json(); })
         .then(function(ok){ if(ok){ $('c-info').textContent=t('cDone'); $('c-btn').hidden=true; } else { $('c-info').textContent=t('cGone'); $('c-btn').hidden=true; } })
         .catch(function(){ $('c-btn').disabled=false; $('c-err').textContent=t('cErr'); });
      };
   })
   .catch(function(){ $('c-info').textContent=t('cErr'); });
}

/* ───────── boot ───────── */
(function boot(){
  if(!CFG){ applyLang(); fail(t('bad')); return; }
  var today=iso(new Date()); $('f-ci').min=today; $('f-co').min=today;
  applyLang();
  if(CANCEL){ cancelMode(); return; }
  Promise.all([
    getJson('/rest/v1/rooms_catalog?select=room,type,capacity,view&order=room').catch(function(){ return getJson('/rest/v1/rooms_catalog?select=room,type,capacity&order=room'); }),
    getJson('/rest/v1/bookings_sync?select=room,ci,co,status&co=gte.'+today),
    getJson('/rest/v1/dta_site_settings?key=eq.booking_policy&select=title,body,fee_ar,fee_en,prepay_ar,prepay_en,notes').catch(function(){ return []; }),
    getJson('/rest/v1/dta_site_settings?key=eq.stay_rules&select=body').catch(function(){ return []; }),
    getJson('/rest/v1/public_rates?select=kind,key,usd,eur,loc').catch(function(){ return null; })
  ]).then(function(res){
    rooms=res[0]||[]; books=res[1]||[]; policy=(res[2]&&res[2][0])||null;
    if(Array.isArray(res[4])){ ENGINE=true; res[4].forEach(function(x){ if(x&&(x.kind==='type'||x.kind==='view')) rates[x.kind][String(x.key)]={usd:+x.usd||0,eur:+x.eur||0,loc:+x.loc||0}; }); }
    try{ var rb=res[3]&&res[3][0]&&res[3][0].body; if(rb){ var ro=JSON.parse(rb); if(ro&&typeof ro==='object') stayRules=ro; } }catch(e){}
    showStayHint();
    if(!rooms.length){ fail(t('noRooms')); return; }
    show('view-form'); applyLang();
  }).catch(function(){ fail(t('loadErr')); });
})();
})();
</script>
